# Snippet de Nginx para GH Contadores y Asociados
#
# Se incluye DENTRO del bloque `server` de demostracion.es (NO crea un vhost nuevo,
# por lo que no afecta a /prelab, /CRMPXS ni al resto de aplicaciones del servidor).
#
#   /ghcontadores/        -> panel de administración (React SPA, archivos estáticos)
#   /ghcontadores/api/    -> API .NET 8 en 127.0.0.1:8095
#   /ghcontadores/hubs/   -> SignalR (WebSocket, requiere Upgrade)
#   /ghcontadores/swagger -> documentación interactiva de la API
#
# Instalación:
#   cp deploy/nginx/ghcontadores.conf /etc/nginx/snippets/ghcontadores.conf
#   # añadir dentro del server{} de demostracion.es:  include /etc/nginx/snippets/ghcontadores.conf;
#   nginx -t && systemctl reload nginx

# --- Redirección de la ruta sin barra final -------------------------------
location = /ghcontadores { return 301 https://$host/ghcontadores/; }

# --- API .NET 8 -----------------------------------------------------------
# La barra final de proxy_pass elimina el prefijo /ghcontadores antes de
# entregar la petición a la API (la API expone /api/v1/...).
location /ghcontadores/api/ {
    proxy_pass http://127.0.0.1:8095/api/;

    proxy_buffer_size       16k;
    proxy_buffers           8 16k;
    proxy_busy_buffers_size 32k;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_connect_timeout 30s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    # Subida de documentos de expedientes (25 MB por archivo + margen).
    client_max_body_size 60m;
}

# --- SignalR (tiempo real) ------------------------------------------------
# El WebSocket necesita las cabeceras Upgrade/Connection y timeouts largos;
# sin esto el app perdería la actualización en vivo de expedientes y pedidos.
location /ghcontadores/hubs/ {
    proxy_pass http://127.0.0.1:8095/hubs/;

    proxy_http_version 1.1;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# --- Swagger --------------------------------------------------------------
location /ghcontadores/swagger {
    proxy_pass http://127.0.0.1:8095/swagger;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /ghcontadores/health {
    proxy_pass http://127.0.0.1:8095/health;
    proxy_set_header Host $host;
    access_log off;
}

# --- Panel de administración (React SPA) ---------------------------------
location /ghcontadores/ {
    alias /var/www/ghcontadores/admin/;
    index index.html;
    # SPA: cualquier ruta desconocida se resuelve con index.html.
    try_files $uri $uri/ /ghcontadores/index.html;

    add_header Cache-Control "no-cache" always;

    location ~* ^/ghcontadores/assets/.*\.(js|css|woff2?|png|jpg|jpeg|svg|webp|ico)$ {
        alias /var/www/ghcontadores/admin/;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
